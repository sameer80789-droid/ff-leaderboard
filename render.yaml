services:
  - type: web
    name: ff-leaderboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FF_ACCOUNTS_JSON
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
